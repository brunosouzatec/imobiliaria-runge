name: Build and deploy Imobiliária Runge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configurar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci --ignore-scripts
      - name: Executar testes
        run: npm test
      - name: Auditar dependências
        run: npm audit --audit-level=moderate

  build-and-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build e push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Liberar temporariamente o IP do runner no firewall
        id: firewall
        env:
          DO_API_TOKEN: ${{ secrets.DIGITALOCEAN_FIREWALL_TOKEN }}
          DO_FIREWALL_ID: ${{ vars.DO_FIREWALL_ID }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$DO_API_TOKEN" ] || [ -z "$DO_FIREWALL_ID" ]; then
            echo "Configure os segredos DIGITALOCEAN_FIREWALL_TOKEN e a variável DO_FIREWALL_ID no GitHub."
            exit 1
          fi
          if ! [[ "$DO_FIREWALL_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "A variável DO_FIREWALL_ID não contém um identificador válido de firewall."
            exit 1
          fi

          runner_ip="$(curl --ipv4 --fail --silent --show-error https://api.ipify.org)"
          python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit("O IP público do runner não é IPv4.")
          PY

          firewall_url="https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $DO_API_TOKEN" \
            "$firewall_url" --output "$RUNNER_TEMP/firewall-before.json"

          runner_rule="$(jq -n --arg ip "$runner_ip/32" '{inbound_rules:[{protocol:"tcp",ports:"22",action:"allow",sources:{addresses:[$ip]}}]}')"
          already_allowed="$(jq --arg ip "$runner_ip/32" '[.firewall.inbound_rules[] | select(.protocol == "tcp" and .ports == "22" and (.action // "allow") == "allow" and ((.sources.addresses // []) | index($ip) != null))] | length' "$RUNNER_TEMP/firewall-before.json")"

          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"
          if [ "$already_allowed" -gt 0 ]; then
            echo "remove_rule=false" >> "$GITHUB_OUTPUT"
            echo "O runner já possui acesso SSH permitido; nenhuma regra temporária foi criada."
            exit 0
          fi

          echo "remove_rule=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$runner_rule" > "$RUNNER_TEMP/firewall-rule.json"
          curl --retry 3 --retry-all-errors --retry-delay 2 \
            --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $DO_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/firewall-rule.json" \
            "$firewall_url/rules"

          python3 - "$DEPLOY_HOST" <<'PY'
          import socket
          import sys
          import time

          host = sys.argv[1]
          for attempt in range(20):
              try:
                  with socket.create_connection((host, 22), timeout=2):
                      print("A porta SSH da VPS está acessível para este runner.")
                      break
              except OSError:
                  if attempt == 19:
                      raise SystemExit("A regra temporária não liberou o SSH em até 80 segundos.")
                  time.sleep(2)
          PY

      - name: Deploy via SSH
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:latest
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,R2_PUBLIC_URL,ADMIN_EMAIL,ADMIN_PASSWORD,APP_SECRET,DEPLOY_PATH,GHCR_READ_TOKEN,IMAGE_REF
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            touch .env
            sed -i '/^R2_ACCOUNT_ID=/d; /^R2_ACCESS_KEY_ID=/d; /^R2_SECRET_ACCESS_KEY=/d; /^R2_BUCKET_NAME=/d; /^R2_PUBLIC_URL=/d' .env
            sed -i '/^ADMIN_EMAIL=/d; /^ADMIN_PASSWORD=/d; /^APP_SECRET=/d; /^APP_PUBLIC_URL=/d; /^TRUST_PROXY=/d; /^PUBLIC_ORIGIN=/d' .env
            printf '%s\n' "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" "R2_BUCKET_NAME=$R2_BUCKET_NAME" "R2_PUBLIC_URL=$R2_PUBLIC_URL" "ADMIN_EMAIL=$ADMIN_EMAIL" "ADMIN_PASSWORD=$ADMIN_PASSWORD" "APP_SECRET=$APP_SECRET" "APP_PUBLIC_URL=https://tatuiimoveis.com.br" "TRUST_PROXY=true" "PUBLIC_ORIGIN=https://tatuiimoveis.com.br" >> .env
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            curl --fail --silent --show-error --location "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml" --output docker-compose.yml
            # Remove apenas recursos Docker sem uso; volumes persistem para não afetar o banco.
            docker image prune --all --force
            docker builder prune --all --force || true
            docker pull "$IMAGE_REF"
            IMAGE_NAME="$IMAGE_REF" docker compose up -d --no-build --remove-orphans

      - name: Remover regra SSH temporária do firewall
        if: ${{ always() && steps.firewall.outputs.remove_rule == 'true' }}
        env:
          DO_API_TOKEN: ${{ secrets.DIGITALOCEAN_FIREWALL_TOKEN }}
          DO_FIREWALL_ID: ${{ vars.DO_FIREWALL_ID }}
          RUNNER_IP: ${{ steps.firewall.outputs.runner_ip }}
        run: |
          set -euo pipefail
          cleanup_rule="$(jq -n --arg ip "$RUNNER_IP/32" '{inbound_rules:[{protocol:"tcp",ports:"22",action:"allow",sources:{addresses:[$ip]}}]}')"
          curl --retry 3 --retry-all-errors --retry-delay 2 \
            --fail --silent --show-error --request DELETE \
            --header "Authorization: Bearer $DO_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "$cleanup_rule" \
            "https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID/rules"

          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $DO_API_TOKEN" \
              "https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID" \
              --output "$RUNNER_TEMP/firewall-after-cleanup.json"
            remaining="$(jq --arg ip "$RUNNER_IP/32" '[.firewall.inbound_rules[] | select(.protocol == "tcp" and .ports == "22" and (.action // "allow") == "allow" and ((.sources.addresses // []) | index($ip) != null))] | length' "$RUNNER_TEMP/firewall-after-cleanup.json")"
            if [ "$remaining" -eq 0 ]; then
              echo "Regra temporária de SSH removida do firewall."
              exit 0
            fi
            sleep 2
          done

          echo "A regra de SSH não foi removida do firewall dentro do tempo esperado."
          exit 1
