<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Termos de Uso do portal Tatuí Imóveis.">
  <title>Termos de Uso | Tatuí Imóveis</title>
  <link rel="icon" href="assets/tatui-imoveis-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="react.css">
  <link rel="stylesheet" href="react-pages.css">
</head>
<body>
  <div data-site-header></div>
  <main class="react-page privacy-page">
    <p class="eyebrow">Regras de utilização</p>
    <h1>Termos de Uso</h1>
    <p class="react-lead">As regras para navegação, cadastro e publicação de anúncios no portal Tatuí Imóveis estão reunidas nesta página.</p>
    <section class="privacy-section" id="termos-dinamicos"><p>Carregando os Termos de Uso…</p></section>
  </main>
  <div data-site-footer></div>
  <script src="site-chrome.js"></script>
  <script>SiteChrome.mount(document, 'terms');</script>
  <script>
    fetch('/api/conteudos/termos_uso')
      .then(response => response.ok ? response.json() : null)
      .then(data => {
        if (!data?.conteudo) return;
        const section = document.querySelector('#termos-dinamicos');
        section.replaceChildren();
        data.conteudo.split(/\r?\n/).map(line => line.trim()).filter(Boolean).forEach(line => {
          const isHeading = /^\d+(?:\.\d+)*[.)]?\s+\S/.test(line);
          const element = document.createElement(isHeading ? 'h2' : 'p');
          element.textContent = line;
          section.appendChild(element);
        });
      })
      .catch(() => {});
  </script>
</body>
</html>
