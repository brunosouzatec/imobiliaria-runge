<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tatuí Imóveis | Em manutenção</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; background: #f6f4ef; color: #123f3e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; }
    main { width: min(680px, 100%); padding: clamp(36px, 7vw, 76px); text-align: center; background: #fffdf9; border: 1px solid #e5ded4; border-radius: 24px; box-shadow: 0 20px 60px rgba(18, 63, 62, .10); }
    .brand { display: block; width: min(360px, 100%); height: auto; margin: 0 auto 32px; }
    .eyebrow { margin: 0 0 14px; color: #ef6719; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(38px, 6vw, 64px); font-weight: 400; line-height: 1.05; }
    p { margin: 24px auto 0; max-width: 480px; color: #536b6c; font-size: 17px; line-height: 1.7; }
    small { display: block; margin-top: 32px; color: #8a9692; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <svg class="brand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 124" role="img" aria-labelledby="brand-title brand-desc">
      <title id="brand-title">Tatuí Imóveis</title>
      <desc id="brand-desc">Logo Tatuí Imóveis, o portal de imóveis de Tatuí</desc>
      <g fill="none" stroke="#0b5f5b" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="6" d="M12 58 49 24l37 34v47H12z"/>
        <path stroke-width="6" d="M49 24 68 7l37 34v64H86"/>
        <path stroke-width="6" d="M49 72v33M49 105h24"/>
        <path fill="#df6a25" stroke="none" d="M101 24v43c0 7-6 13-14 13-7 0-12-4-12-9s5-10 12-11c4 0 7 1 9 3V24z"/>
        <path fill="#df6a25" stroke="none" d="M101 24c15 4 22 13 22 25 0 5-2 10-5 14 1-12-4-20-17-24z"/>
      </g>
      <text x="137" y="57" fill="#123d40" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="1.5">TATUÍ IMÓVEIS</text>
      <text x="139" y="84" fill="#6b7d7b" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.2">O PORTAL DE IMÓVEIS DE TATUÍ</text>
      <path d="M140 100h210" stroke="#df6a25" stroke-width="3" stroke-linecap="round"/>
      <text x="362" y="105" fill="#0b5f5b" font-family="Georgia, serif" font-size="17" font-style="italic">Cidade Ternura</text>
    </svg>
    <p class="eyebrow">Manutenção programada</p>
    <h1>Estamos preparando novidades.</h1>
    <p>Nosso portal está temporariamente em manutenção. Em breve estaremos de volta com tudo funcionando.</p>
    <small>Agradecemos a compreensão.</small>
  </main>
</body>
</html>
