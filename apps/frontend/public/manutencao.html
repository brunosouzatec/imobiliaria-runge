<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tatuí Imóveis | Em manutenção</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; background: #f6f4ef; color: #123f3e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; }
    main { width: min(680px, 100%); padding: clamp(36px, 7vw, 76px); text-align: center; background: #fffdf9; border: 1px solid #e5ded4; border-radius: 24px; box-shadow: 0 20px 60px rgba(18, 63, 62, .10); }
    .mark { width: 72px; height: 72px; margin: 0 auto 28px; display: grid; place-items: center; border-radius: 20px; background: #123f3e; color: #ef6719; font-size: 34px; font-weight: 800; }
    .eyebrow { margin: 0 0 14px; color: #ef6719; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(38px, 6vw, 64px); font-weight: 400; line-height: 1.05; }
    p { margin: 24px auto 0; max-width: 480px; color: #536b6c; font-size: 17px; line-height: 1.7; }
    small { display: block; margin-top: 32px; color: #8a9692; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌂</div>
    <p class="eyebrow">Tatuí Imóveis</p>
    <h1>Estamos preparando novidades.</h1>
    <p>Nosso portal está temporariamente em manutenção. Em breve estaremos de volta com tudo funcionando.</p>
    <small>Agradecemos a compreensão.</small>
  </main>
</body>
</html>
