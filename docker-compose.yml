services:
  mysql:
    image: mysql:8.4
    container_name: runge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  imobiliaria-runge:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: ${IMAGE_NAME:-imobiliaria-runge:local}
    container_name: imobiliaria-runge
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      EMAIL_PUBLIC_URL: ${EMAIL_PUBLIC_URL:-}
      EMAIL_LOGO_PATH: ${EMAIL_LOGO_PATH:-/assets/tatui-imoveis-logo-email.png}
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      DATA_DIR: /data
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      - runge-data:/data
      - ./Fotos_imoveis:/data/Fotos_imoveis

volumes:
  runge-data:
  mysql-data:
